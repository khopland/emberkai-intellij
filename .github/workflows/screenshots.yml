# Renders every preset in the development IDE so theme changes can be reviewed as images.
# Not a required check: the PNGs are uploaded as an artifact and nothing is committed.
name: Screenshots
on:
  pull_request:
    paths:
      - 'src/main/resources/**'
      - 'docs/samples/**'
      - 'build.gradle.kts'
      - '.github/workflows/screenshots.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  screenshots:
    name: Capture presets
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: true
      - name: Install Xvfb
        run: command -v xvfb-run || (sudo apt-get update && sudo apt-get install -y xvfb)
      # Xvfb has no 2x scaling, so the IDE scales itself to keep 2800 x 2000 captures.
      - name: Capture
        run: xvfb-run -a -s "-screen 0 3000x2200x24" ./gradlew screenshots -PscreenshotScale=2 --console=plain
      - name: Upload screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshots
          path: docs/screenshots/*.png
          if-no-files-found: error
          retention-days: 14
      - name: Upload IDE logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshot-logs
          path: .intellijPlatform/sandbox/*/*/log_screenshot*/
          if-no-files-found: ignore
          retention-days: 7
