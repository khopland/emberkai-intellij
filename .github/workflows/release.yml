name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    name: Build release archive
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
      - name: Check tag matches plugin version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          version="$(sed -n 's/^pluginVersion=//p' gradle.properties)"
          if [ "$RELEASE_TAG" != "v$version" ]; then
            echo "::error::Release tag $RELEASE_TAG does not match pluginVersion $version (expected v$version)"
            exit 1
          fi
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@07d1f8453baaff67fb503883367f8b13e6158a54 # v6
        with:
          cache-provider: basic
      - name: Validate, verify, and build
        run: ./gradlew --no-daemon check verifyPluginStructure verifyPlugin buildPlugin
      - name: Checksum the plugin
        run: (cd build/distributions && sha256sum ./*.zip > SHA256SUMS)
      - name: Upload installable plugin
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: emberkai-plugin
          path: build/distributions/*
          if-no-files-found: error
      - name: Save verification reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-verification
          path: build/reports/pluginVerifier/
          if-no-files-found: ignore
      - name: Attach archive to the release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" build/distributions/* --clobber

  publish:
    name: Publish to JetBrains Marketplace
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: marketplace
      url: https://plugins.jetbrains.com/plugin/com.github.khopland.emberkai
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@07d1f8453baaff67fb503883367f8b13e6158a54 # v6
        with:
          cache-provider: basic
      - name: Sign and publish the tagged plugin
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -z "$PUBLISH_TOKEN" ]; then
            echo "::error::PUBLISH_TOKEN secret is not set"
            exit 1
          fi
          # IntelliJ Platform Gradle Plugin 2.19 cannot sign a pre-built archive while buildPlugin
          # is excluded, so rebuild from the tag, sign when configured, and publish.
          ./gradlew --no-daemon signPlugin publishPlugin
