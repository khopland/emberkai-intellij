name: Prepare release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/validate.yml
  release:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Check release version
        id: version
        shell: bash
        run: |
          release_version="$(sed -n 's/^pluginVersion=//p' gradle.properties)"
          if [[ -z "$release_version" || "$GITHUB_REF_NAME" != "v$release_version" ]]; then
            echo "::error::Tag must match pluginVersion in gradle.properties."
            exit 1
          fi
          echo "version=$release_version" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@07d1f8453baaff67fb503883367f8b13e6158a54 # v6
        with:
          cache-provider: basic
      - name: Verify and package release
        run: ./gradlew prepareRelease --no-daemon --console=plain
        env:
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
      - name: Save verification reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-verification
          path: build/reports/pluginVerifier/
          if-no-files-found: ignore
      - name: Extract release notes
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          version = os.environ['RELEASE_VERSION']
          changelog = Path('CHANGELOG.md').read_text()
          heading = f'## {version}\n'
          if heading not in changelog:
              raise SystemExit(f'Missing changelog entry for {version}')
          notes = changelog.split(heading, 1)[1].split('\n## ', 1)[0].strip()
          if not notes:
              raise SystemExit(f'Empty changelog entry for {version}')
          Path('build/release-notes.md').write_text(notes + '\n')
          PY
      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "$GITHUB_REF_NAME" build/release/* \
            --verify-tag --draft --title "Emberkai $RELEASE_VERSION" \
            --notes-file build/release-notes.md
