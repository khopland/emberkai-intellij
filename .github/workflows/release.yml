name: Release
on:
  release:
    types: [ published ]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing published GitHub release tag (for recovery)
        required: true
        type: string
      publish_marketplace:
        description: Upload to Marketplace (disable if this version was already uploaded)
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: marketplace-release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  release:
    name: Validate and publish plugin
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: marketplace
      url: https://plugins.jetbrains.com/plugin/com.github.khopland.emberkai
    permissions:
      contents: write
    steps:
      - name: Resolve published GitHub release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          release=$(gh release view "$RELEASE_TAG" --json tagName,isDraft)
          if [[ $(jq -r '.isDraft' <<< "$release") != false ]]; then
            echo 'Publish the GitHub release before running Marketplace delivery.' >&2
            exit 1
          fi
          echo "tag=$(jq -r '.tagName' <<< "$release")" >> "$GITHUB_OUTPUT"

      - name: Validate publishing credentials
        env:
          PUBLISH_MARKETPLACE: ${{ github.event_name == 'release' || inputs.publish_marketplace }}
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
        run: |
          if [[ "$PUBLISH_MARKETPLACE" == true && -z "$PUBLISH_TOKEN" ]]; then
            echo 'Add the PUBLISH_TOKEN GitHub Actions secret from your JetBrains Marketplace account.' >&2
            exit 1
          fi
          if [[ -n "$PRIVATE_KEY" || -n "$CERTIFICATE_CHAIN" || -n "$PRIVATE_KEY_PASSWORD" ]]; then
            if [[ -z "$PRIVATE_KEY" || -z "$CERTIFICATE_CHAIN" ]]; then
              echo 'Signing requires both PRIVATE_KEY and CERTIFICATE_CHAIN; PRIVATE_KEY_PASSWORD is optional.' >&2
              exit 1
            fi
          fi

      - name: Fetch tagged sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refs/tags/${{ steps.release.outputs.tag }}
          persist-credentials: false

      - name: Validate tag, version and changelog
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          version=$(sed -n 's/^pluginVersion=//p' gradle.properties)
          if [[ "$RELEASE_TAG" != "v$version" ]]; then
            echo "Tag $RELEASE_TAG does not match pluginVersion $version in gradle.properties (expected v$version)." >&2
            exit 1
          fi
          grep -q "^## \[$version\]" CHANGELOG.md || { echo "CHANGELOG.md has no entry for $version." >&2; exit 1; }

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@07d1f8453baaff67fb503883367f8b13e6158a54 # v6
        with:
          cache-provider: basic

      # Validates the themes, runs Plugin Verifier, signs when configured, and stages the
      # archive and SHA256SUMS in build/release.
      - name: Validate, verify, sign and package the tagged plugin
        env:
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
        run: ./gradlew prepareRelease --no-daemon --console=plain

      - name: Collect validation reports
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-validation-reports
          path: build/reports/pluginVerifier/
          if-no-files-found: ignore

      # Upload assets first so a GitHub upload failure cannot follow a successful Marketplace upload.
      - name: Upload GitHub release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: gh release upload "$RELEASE_TAG" build/release/* --clobber

      # Publishes the archive staged above (signed when configured) without rebuilding it.
      - name: Publish to JetBrains Marketplace
        if: github.event_name == 'release' || inputs.publish_marketplace
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
        run: ./gradlew publishPlugin -x buildPlugin -x signPlugin --no-daemon --console=plain
