# Build, validate and verify the themes. On main, prepare a draft GitHub release for a version with a changelog entry.
name: Build
on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: IntelliJ ${{ matrix.platform }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        platform: [ '2026.1.4', '2026.2.3' ]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@07d1f8453baaff67fb503883367f8b13e6158a54 # v6
        with:
          cache-provider: basic
      - name: Validate themes, verify and build plugin
        run: ./gradlew check verifyPluginStructure verifyPlugin buildPlugin --no-daemon --console=plain -PplatformVersion=${{ matrix.platform }}
      - name: Upload Plugin Verifier result
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: pluginVerifier-result-${{ matrix.platform }}
          path: build/reports/pluginVerifier/
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload plugin
        if: matrix.platform == '2026.2.3'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: plugin-distribution
          path: build/distributions/*.zip
          if-no-files-found: error
          retention-days: 14

  releaseDraft:
    name: Release draft
    # Publishing the draft creates the tag and starts the release workflow.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [ build ]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Read version
        id: metadata
        run: |
          version=$(sed -n 's/^pluginVersion=//p' gradle.properties)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if grep -q "^## \[$version\]" CHANGELOG.md; then echo "releasable=true" >> "$GITHUB_OUTPUT"; fi
      - name: Download tested plugin
        if: steps.metadata.outputs.releasable == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: plugin-distribution
          path: build/distributions
      - name: Prepare release draft
        if: steps.metadata.outputs.releasable == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.metadata.outputs.version }}
        run: bash .github/scripts/prepare_release_draft.sh
